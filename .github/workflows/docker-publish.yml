# Copyright 2026 Query Farm LLC - https://query.farm
#
# Build + publish the multi-arch vgi-search image to ghcr.io. The heavy lifting
# (multi-arch build -> per-arch /health boot smoke -> image SQL smoke -> push-by-digest
# -> manifest -> cosign-sign) lives in the shared reusable workflow
# Query-farm/vgi-actions/docker-publish.yml; this file gates on the repo's own CI and
# supplies the worker-specific inputs.
#
# Tag-driven: vX.Y.Z -> :X.Y.Z / :X.Y / :latest; push to main -> :edge.
name: Publish image to ghcr.io

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [ci]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: Query-farm/vgi-actions/.github/workflows/docker-publish.yml@v1
    secrets: inherit
    with:
      image_name: vgi-search
      smoke_import: "vgi_search, httpx, pyarrow"
      health_port: "8000"
      version_check_cmd: "ci/check-version.sh"
      # Prove the built image's two entrypoints speak the VGI protocol against the
      # signed vgi extension. The worker *logic* over every transport (all four
      # test/sql/* files, mock-driven, three transports, two OSes) is already
      # exercised each run by the gating `ci` job, so here we only smoke the
      # image's stdio + http entrypoints with `providers.test` — the static
      # `search_providers()` directory, which makes NO upstream HTTP calls (no
      # keys, no network egress). Throwaway *_API_KEY env vars make the keyed
      # providers report `configured` so the directory assertions hold. haybarn is
      # invoked directly (this repo's ci/run-integration.sh always spawns the
      # in-process mock launcher, which is not in the shipped image). $CITEST_IMAGE
      # is the loaded <image>:citest-amd64 ref; GH_TOKEN is provided for download.
      image_test: |
        # Guard against haybarn's default skip list silently swallowing an error
        # (it SKIPs any error message containing "HTTP" -> a fake pass), so assert
        # each leg actually PASSED and ran a case, never skipped.
        assert_passed() {
          grep -q "All tests passed" "$1" || { echo "::error::image test did not pass"; cat "$1"; exit 1; }
          if grep -qi "skipped" "$1"; then echo "::error::image test was skipped (fake pass)"; cat "$1"; exit 1; fi
        }

        echo "::group::download haybarn-unittest"
        REL=$(gh release view --repo Query-farm-haybarn/haybarn --json tagName --jq .tagName)
        gh release download "$REL" --repo Query-farm-haybarn/haybarn \
          --pattern 'haybarn_unittest-linux-amd64.zip' --output hb.zip --clobber
        mkdir -p hb && unzip -o -q hb.zip -d hb
        HB="$PWD/$(find hb -name 'haybarn-unittest' -type f | head -1)"
        chmod +x "$HB"
        echo "::endgroup::"

        # Stage the transport-agnostic .test through this repo's preprocessor,
        # which injects the signed `INSTALL vgi FROM community;` before the bare
        # `LOAD vgi;` so a clean runner (haybarn links no extensions) can resolve
        # vgi. The http leg additionally needs httpfs (the vgi HTTP transport is
        # layered on it); without httpfs the ATTACH errors "...HTTP..." and
        # haybarn silently SKIPs the file — hence the assert_passed guard.
        mkdir -p stage_stdio/test/sql stage_http/test/sql
        awk -f ci/preprocess-require.awk test/sql/providers.test > stage_stdio/test/sql/providers.test
        awk '
          { print }
          /^[ \t]*LOAD[ \t]+vgi[ \t]*;[ \t]*$/ && !done {
            print ""; print "statement ok"; print "INSTALL httpfs FROM core;";
            print ""; print "statement ok"; print "LOAD httpfs;"; done = 1
          }
        ' stage_stdio/test/sql/providers.test > stage_http/test/sql/providers.test

        echo "::group::stdio entrypoint smoke (providers directory, one cold container)"
        VGI_SEARCH_WORKER="docker run -i --rm -e BRAVE_API_KEY=x -e TAVILY_API_KEY=x -e EXA_API_KEY=x $CITEST_IMAGE stdio" \
          "$HB" --test-dir stage_stdio "test/sql/providers.test" 2>&1 | tee stdio.out
        assert_passed stdio.out
        echo "::endgroup::"

        echo "::group::http entrypoint smoke (one warm container)"
        CID=$(docker run -d -p 18000:8000 -e BRAVE_API_KEY=x -e TAVILY_API_KEY=x -e EXA_API_KEY=x "$CITEST_IMAGE")
        trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
        for _ in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:18000/health && break; sleep 1; done
        VGI_SEARCH_WORKER="http://localhost:18000" \
          "$HB" --test-dir stage_http "test/sql/providers.test" 2>&1 | tee http.out
        assert_passed http.out
        docker rm -f "$CID" >/dev/null 2>&1 || true
        echo "::endgroup::"
